---
global:
  resolve_timeout: 5m

route:
  receiver: default-logger
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default-logger
      continue: true

receivers:
  - name: default-logger
    # Learning placeholder: log to stdout via webhook or leave empty.
    # Replace with Slack/email/webhook in a real environment.
    webhook_configs: []

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]
