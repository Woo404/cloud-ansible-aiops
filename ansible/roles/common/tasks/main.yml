---
- name: Ensure apt cache is fresh
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"
  failed_when: false

- name: Ensure chrony is installed for NTP
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Enable and start chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  failed_when: false

- name: Create application base directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"
